<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Salvage Health</title>
<meta name="description" content="Salvage Health, from Bryan Dourado, author of Fitness Without the Fear. Coming soon.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root{--bg:#141413;--raised:#1c1b19;--fg:#FAF9F5;--dim:#C9C7C0;--faint:#9C9A93;--accent:#D97757;--ink:#3A241A;--rule:#3A3934;color-scheme:dark}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,-apple-system,Segoe UI,Arial,sans-serif;line-height:1.55;display:flex;align-items:center;justify-content:center;padding:48px 20px}
  main{max-width:620px;width:100%;display:grid;gap:22px}
  .eyebrow{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--accent)}
  h1{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:clamp(44px,10vw,76px);line-height:1;letter-spacing:-1px;margin:0}
  p{margin:0;font-size:17px;color:var(--dim);max-width:46ch}
  .card{display:flex;gap:18px;align-items:center;background:var(--raised);border:1px solid var(--rule);border-radius:12px;padding:18px 20px;text-decoration:none;color:inherit;margin-top:10px}
  .card img{width:58px;height:auto;border-radius:4px;flex:none}
  .card b{display:block;font-size:16px;color:var(--fg)}
  .card span{font-size:13.5px;color:var(--faint)}
  .card:hover{border-color:var(--accent)}
  .card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  footer{font-size:12.5px;color:var(--faint);margin-top:18px}
</style>
</head>
<body>
<main>
  <div class="eyebrow">Coming soon</div>
  <h1>Salvage Health</h1>
  <p>Health and fitness information in plain English, from Bryan Dourado. More is on the way.</p>
  <a class="card" href="/book">
    <img src="/book/paperback-cover.jpg" alt="Fitness Without the Fear cover">
    <div><b>Start with the book: Fitness Without the Fear</b><span>Your personal plan app, worksheet, sources and every edition</span></div>
  </a>
  <footer>&copy; 2026 Salvage Health</footer>
</main>
</body>
</html>
